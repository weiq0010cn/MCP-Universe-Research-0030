name: Issue Label Auto-Commenter

on:
  issues:
    types:
      - opened

permissions:
  issues: write

jobs:
  bug-comment:
    if: contains(toJSON(github.event.issue.labels.*.name), 'bug')
    runs-on: ubuntu-latest
    steps:
      - name: Add bug comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'Thank you. We will fix it.'
            })

  feature-comment:
    if: contains(toJSON(github.event.issue.labels.*.name), 'feature')
    runs-on: ubuntu-latest
    steps:
      - name: Add feature comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'Thank you, we will consider to include this feature.'
            })

  discussion-comment:
    if: contains(toJSON(github.event.issue.labels.*.name), 'discussion')
    runs-on: ubuntu-latest
    steps:
      - name: Add discussion comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'Thanks for starting this discussion! We welcome community input.'
            })
